<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Admin OTP - SmartCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

    <!-- Swiggy Styled Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-swiggy sticky-top">
        <div class="container-fluid px-4">
            <a href="/" class="navbar-brand navbar-brand-swiggy">
                <div class="brand-icon-box"><i class="bi bi-bag-heart-fill"></i></div>
                <span>SmartCart <span class="badge bg-danger fs-6 rounded-pill font-monospace align-middle ms-1">Admin</span></span>
            </a>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container py-5" style="max-width: 480px;">
        <div class="bg-white rounded-4 p-4 p-md-5 shadow-sm border text-center">
            <div class="swiggy-icon-circle mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.8rem; background: #ecfdf5; color: #10b981;">
                <i class="bi bi-shield-check"></i>
            </div>
            <h2 class="fw-extrabold text-dark mb-1">Verify Admin OTP</h2>
            <p class="text-muted small mb-4">Enter 6-digit OTP code sent to your email & choose a secure password</p>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show rounded-4 border-0 shadow-sm" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
              {% endfor %}
            {% endwith %}

            <form method="POST" action="/verify-otp">
                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted small text-uppercase">6-Digit Verification OTP</label>
                    <input type="text" name="otp" class="form-control form-control-swiggy text-center fs-3 font-monospace tracking-widest" placeholder="123456" maxlength="6" required autofocus>
                </div>

                <div class="mb-4 text-start">
                    <label class="form-label fw-semibold">Set Admin Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" name="password" class="form-control form-control-swiggy border-start-0 ps-0" placeholder="Choose a strong password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-swiggy-primary w-100 py-2 fs-6">
                    <i class="bi bi-check-circle me-2"></i>Verify OTP & Complete Registration
                </button>
            </form>

            <div class="mt-4 text-center">
                <a href="/admin-signup" class="small text-muted text-decoration-none">
                    <i class="bi bi-arrow-left me-1"></i> Back to Registration
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
