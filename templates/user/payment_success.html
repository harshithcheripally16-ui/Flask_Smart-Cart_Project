<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - SmartCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .success-icon-pulse {
            width: 80px;
            height: 80px;
            font-size: 2.8rem;
            background: #ecfdf5;
            color: #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 10px rgba(16, 185, 129, 0.15);
            animation: pulseSuccess 2s infinite;
        }
        @keyframes pulseSuccess {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="bg-light">

    <!-- Swiggy Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-swiggy sticky-top">
        <div class="container-fluid px-4">
            <a href="/" class="navbar-brand navbar-brand-swiggy">
                <div class="brand-icon-box"><i class="bi bi-bag-heart-fill"></i></div>
                <span>SmartCart <span class="badge bg-success fs-6 rounded-pill align-middle ms-1">Order Confirmed</span></span>
            </a>
        </div>
    </nav>

    <!-- Main Payment Success Container -->
    <div class="container py-5" style="max-width: 560px;">
        <div class="bg-white rounded-4 p-4 p-md-5 shadow-sm border text-center">
            
            <div class="success-icon-pulse mx-auto mb-4">
                <i class="bi bi-check-circle-fill"></i>
            </div>
            
            <h2 class="fw-extrabold text-success mb-1">Payment Successful!</h2>
            <p class="text-muted small mb-4">Your transaction was completed and verified successfully.</p>

            <!-- Payment Receipt Details Box -->
            <div class="bg-light p-4 rounded-4 border text-start mb-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="text-muted small fw-bold text-uppercase">Payment ID</span>
                    <span class="badge bg-white text-success border px-3 py-1 font-monospace fs-6">{{ payment_id }}</span>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="text-muted small fw-bold text-uppercase">Razorpay Order ID</span>
                    <span class="badge bg-white text-dark border px-3 py-1 font-monospace fs-6">{{ order_id }}</span>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-0">
                    <span class="text-muted small fw-bold text-uppercase">Payment Status</span>
                    <span class="badge bg-success text-white fw-bold px-3 py-1"><i class="bi bi-patch-check-fill me-1"></i>Captured (Test Gateway)</span>
                </div>
            </div>

            <div class="d-grid gap-2">
                <a href="/" class="btn btn-swiggy-primary py-3 fs-6">
                    <i class="bi bi-bag-check-fill me-1"></i> Continue Shopping
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
